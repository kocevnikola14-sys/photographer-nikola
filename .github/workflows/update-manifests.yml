name: Update all manifests

on:
  push:
    paths:
      - 'koncerti/**'
      - 'portreti/**'
      - 'mesana zbirka/**'
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-manifests:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4.2.2
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Setup Python
        uses: actions/setup-python@v5.3.0
        with:
          python-version: '3.12'
      
      - name: Generate all manifests
        run: python3 generate-all-manifests.py
      
      - name: Commit and push if changed
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          # Dodaj vse manifest.json datoteke
          git add koncerti/manifest.json portreti/manifest.json "mesana zbirka/manifest.json" 2>/dev/null || true
          
          # Preveri ali obstajajo spremembe
          if git diff --staged --quiet; then
            echo "📭 Ni sprememb - preskočim commit"
          else
            git commit -m "Auto-update manifests [skip ci]"
            git push
            echo "✅ Manifesti posodobljeni in pushani!"
          fi
