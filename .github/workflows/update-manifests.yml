name: Update all manifests

on:
  push:
    paths:
      - 'koncerti/**'
      - 'portreti/**'
      - 'mesana zbirka/**'
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-manifests:
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || !contains(github.event.head_commit.message, '[skip ci]')
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      
      - name: Generate manifest for koncerti
        run: |
          python3 generate-manifest-koncerti.py
          echo "koncerti done"
      
      - name: Generate manifest for portreti
        run: |
          python3 generate-manifest-portreti.py
          echo "portreti done"
      
      - name: Generate manifest for mesana zbirka
        run: |
          python3 generate-manifest-mesana.py
          echo "mesana zbirka done"
      
      - name: Check for changes
        id: git-check
        run: |
          git status --porcelain
          if [[ -n "$(git status --porcelain)" ]]; then
            echo "changes=true" >> $GITHUB_OUTPUT
          else
            echo "changes=false" >> $GITHUB_OUTPUT
          fi
      
      - name: Commit and push if changed
        if: steps.git-check.outputs.changes == 'true'
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add koncerti/manifest.json portreti/manifest.json "mesana zbirka/manifest.json"
          git commit -m "Auto-update manifests [skip ci]"
          git push
