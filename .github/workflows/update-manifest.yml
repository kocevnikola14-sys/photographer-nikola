name: Update manifest.json

on:
  push:
    paths:
      - 'photos/**'  # ko dodaš/spremeniš slike v mapi photos
  workflow_dispatch:  # omogoča ročni zagon

jobs:
  update:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
    
    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.x'
    
    - name: Run manifest generator
      run: python generate-manifest.py
    
    - name: Commit and push if changed
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@users.noreply.github.com"
        git add photos/manifest.json
        git diff --staged --quiet || (git commit -m "Auto-update manifest.json [skip ci]" && git push)
